server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server, available on every user-defined network (which
  # is what Compose creates). Needed because of the `set` + variable trick below.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # ── Why `set $api_upstream` instead of a literal `proxy_pass http://api:4000`
  #
  # With a literal hostname, nginx resolves it ONCE at startup and caches the IP
  # for the life of the process. `docker compose up -d` gives the recreated api
  # container a new IP, so nginx keeps dialling the old one — and because Docker
  # reuses addresses, that IP often belongs to a *different* live container by
  # then, which answers with `connection refused` on :4000 rather than timing
  # out. The result is a hard 502 on every API call until `web` is restarted by
  # hand. This was hit in production on 2026-09-09.
  #
  # Putting the upstream in a variable defers resolution to request time, so
  # nginx re-resolves via the resolver above (TTL 10s) and follows the container.
  # Both locations must use the variable; one literal is enough to pin the IP.

  # SPA: serve index.html for any unknown path.
  #
  # Security headers are scoped to THIS location on purpose. nginx's add_header
  # does not inherit into a location that sets its own, and a CSP has no business
  # on /api/ JSON responses.
  location / {
    try_files $uri $uri/ /index.html;

    # `always` so these are present on error responses too, not just 200s.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Content-Security-Policy ────────────────────────────────────────────────
    # REPORT-ONLY on purpose. This matters more here than usual: the dashboard
    # JWT lives in localStorage (apps/web/src/lib/api.ts), so an XSS is a full
    # account takeover with no defence in depth. But enforcing a wrong policy
    # blanks the dashboard, so it is staged.
    #
    # ❗Before enforcing, you MUST add your object-storage host to img-src and
    #   media-src. Thumbnails, previews and video load from R2 through presigned
    #   URLs, so with 'self' alone every one of them breaks. For example:
    #     img-src   'self' data: blob: https://<ACCOUNT_ID>.r2.cloudflarestorage.com;
    #     media-src 'self' blob: https://<ACCOUNT_ID>.r2.cloudflarestorage.com;
    #
    # Then watch the browser console for violations, and only once it is quiet
    # rename the header to `Content-Security-Policy` to start enforcing.
    #
    # style-src allows 'unsafe-inline' because React writes inline style
    # attributes; script-src deliberately does not.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
  }

  # API liveness probe, proxied so it is reachable from outside as
  # https://<domain>/health. The response is only {"status","time"} — it
  # deliberately touches no dependency and leaks nothing.
  #
  # The `=` makes this an EXACT match: it forwards /health and nothing else.
  # That matters because T013 adds /health/ready, which DOES report per-
  # dependency detail and must not become public by accident.
  location = /health {
    set $api_upstream api:4000;
    proxy_pass http://$api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  # Backend API (REST + device WebSocket).
  location /api/ {
    set $api_upstream api:4000;
    # $request_uri is the full original path + query string. It is required
    # here: once proxy_pass contains a variable, nginx no longer appends the
    # request URI on its own.
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 2g;
  }
}
