server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: serve index.html for any unknown path.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API liveness probe, proxied so it is reachable from outside as
  # https://<domain>/health. The response is only {"status","time"} — it
  # deliberately touches no dependency and leaks nothing.
  #
  # The `=` makes this an EXACT match: it forwards /health and nothing else.
  # That matters because T013 adds /health/ready, which DOES report per-
  # dependency detail and must not become public by accident.
  location = /health {
    proxy_pass http://api:4000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  # Backend API (REST + device WebSocket).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 2g;
  }
}
