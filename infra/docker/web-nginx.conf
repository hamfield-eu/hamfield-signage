server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS server, available on every user-defined network (which
  # is what Compose creates). Needed because of the `set` + variable trick below.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # ── Why `set $api_upstream` instead of a literal `proxy_pass http://api:4000`
  #
  # With a literal hostname, nginx resolves it ONCE at startup and caches the IP
  # for the life of the process. `docker compose up -d` gives the recreated api
  # container a new IP, so nginx keeps dialling the old one — and because Docker
  # reuses addresses, that IP often belongs to a *different* live container by
  # then, which answers with `connection refused` on :4000 rather than timing
  # out. The result is a hard 502 on every API call until `web` is restarted by
  # hand. This was hit in production on 2026-09-09.
  #
  # Putting the upstream in a variable defers resolution to request time, so
  # nginx re-resolves via the resolver above (TTL 10s) and follows the container.
  # Both locations must use the variable; one literal is enough to pin the IP.

  # SPA: serve index.html for any unknown path.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API liveness probe, proxied so it is reachable from outside as
  # https://<domain>/health. The response is only {"status","time"} — it
  # deliberately touches no dependency and leaks nothing.
  #
  # The `=` makes this an EXACT match: it forwards /health and nothing else.
  # That matters because T013 adds /health/ready, which DOES report per-
  # dependency detail and must not become public by accident.
  location = /health {
    set $api_upstream api:4000;
    proxy_pass http://$api_upstream/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
  }

  # Backend API (REST + device WebSocket).
  location /api/ {
    set $api_upstream api:4000;
    # $request_uri is the full original path + query string. It is required
    # here: once proxy_pass contains a variable, nginx no longer appends the
    # request URI on its own.
    proxy_pass http://$api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 2g;
  }
}
